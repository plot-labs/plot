spring.application.name=plot-api
spring.flyway.enabled=true
spring.flyway.group=true
server.address=127.0.0.1

# Observability is opt-in outside local/test. Production and staging enable
# OpenTelemetry with standard OTEL_* deployment variables.
management.opentelemetry.enabled=false
management.otlp.metrics.export.enabled=false

# WorkOS API verification, provisioning, and membership events.
plot.workos.enabled=false
plot.workos.api-key=
plot.workos.client-id=
plot.workos.issuer=
plot.workos.audience=
plot.workos.jwks-uri=
plot.workos.webhook-secret=
plot.workos.owner-role-slug=owner
plot.workos.bootstrap-enabled=true

# Koog agent and artifact workflow execution is opt-in.
plot.ai.enabled=false
plot.ai.provider=openrouter
plot.ai.base-url=https://openrouter.ai/api/v1
plot.ai.allow-fallbacks=false
plot.ai.require-parameters=false
plot.ai.zero-data-retention=false
plot.ai.content-logging-enabled=false
plot.ai.timeout=45s
plot.ai.writer-temperature=0.2
plot.ai.reviewer-temperature=0.0
plot.ai.max-output-tokens=4000
plot.ai.max-model-calls=12
plot.ai.max-total-tokens=80000
plot.ai.max-run-duration=5m
plot.ai.claim-timeout=10m
plot.ai.retry-initial-delay=250ms
plot.ai.max-evidence-characters=120000
plot.routines.schedule-scan-delay=1h
plot.routine-agent.workers-enabled=true
plot.routine-agent.claim-timeout=2m
plot.routine-agent.retry-initial-delay=1s
plot.routine-agent.max-attempts=3
plot.routine-agent.max-model-calls=8
plot.routine-agent.max-tool-calls=8
plot.routine-agent.max-run-duration=3m
plot.routine-agent.max-input-characters=12000
plot.routine-agent.max-evidence-characters=60000
plot.routine-agent.search-result-limit=8
# Historical Signal/Activity/Chat reconciliation is never enabled for ordinary
# API startup. Operators also have to start the dedicated profile explicitly.
plot.signal-activity-chat-backfill.enabled=false
plot.signal-activity-chat-backfill.checkpoint-key=signal_activity_chat_backfill_v2
plot.signal-activity-chat-backfill.batch-size=100
plot.signal-activity-chat-backfill.max-batches=100
plot.signal-activity-chat-backfill.lease-duration=2m

# GitHub App adapter is opt-in. Keep secrets out of checked-in configuration.
plot.github.enabled=false
plot.github.dev-only=false
plot.github.loopback-only=true
plot.github.state-ttl-seconds=900
plot.github.product-oauth-client-id=
plot.github.product-oauth-client-secret=
plot.github.product-oauth-redirect-uri=
plot.github.product-oauth-scopes=read:user user:email read:org
plot.github.product-credential-encryption-key=
plot.github.product-credential-encryption-key-version=v1
plot.github.product-credential-backfill-batch-size=100
plot.github.import-page-cap=20
plot.github.repository-page-cap=100
plot.github.http-request-timeout=20s

# Polar subscription webhook is opt-in. Keep the signing secret out of checked-in configuration.
plot.polar.enabled=${PLOT_POLAR_ENABLED:false}
plot.polar.webhook-secret=${PLOT_POLAR_WEBHOOKSECRET:}
plot.polar.timestamp-tolerance-seconds=${PLOT_POLAR_TIMESTAMPTOLERANCESECONDS:300}
plot.polar.credits-enabled=${PLOT_POLAR_CREDITS_ENABLED:false}
plot.polar.access-token=${PLOT_POLAR_ACCESS_TOKEN:}
plot.polar.api-base-url=${PLOT_POLAR_API_BASE_URL:https://api.polar.sh}
plot.polar.ai-meter-id=${PLOT_POLAR_AI_METER_ID:}
plot.polar.subscription-product-id=${PLOT_POLAR_SUBSCRIPTION_PRODUCT_ID:}
plot.polar.checkout-success-url=${PLOT_POLAR_CHECKOUT_SUCCESS_URL:}
plot.polar.checkout-return-url=${PLOT_POLAR_CHECKOUT_RETURN_URL:}
plot.polar.customer-portal-return-url=${PLOT_POLAR_CUSTOMER_PORTAL_RETURN_URL:}
plot.polar.request-timeout=10s
plot.polar.max-response-bytes=262144

plot.ai.api-key=${PLOT_AI_API_KEY:}
plot.ai.credit-policy-version=2026-09-18-v2-openrouter-cost
# Koog debug messages can contain prompts; keep provider logging above DEBUG.
logging.level.ai.koog=WARN
